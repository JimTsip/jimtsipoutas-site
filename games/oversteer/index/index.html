<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVERSTEER — playable prototype</title>
<meta name="description" content="A crash game told through a drift car. The multiplier climbs while the car holds the slide; the only decision is when to cash out.">
<link rel="canonical" href="https://jimtsipoutas.com/games/oversteer/">
<meta property="og:title" content="OVERSTEER — playable prototype">
<meta property="og:description" content="A crash game told through a drift car. Nobody steers — you only choose when to cash out.">
<meta property="og:url" content="https://jimtsipoutas.com/games/oversteer/">
<meta property="og:image" content="https://jimtsipoutas.com/games/oversteer/scene-bg.webp">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0c0819">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0819; --lime:#c9f53d; --violet:#b49dff;
    --muted:#9a90c4; --line:rgba(180,157,255,.22);
    --phone-w:390px; --phone-h:844px; --scale:1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink); color:#f1eeff;
    font-family:"Barlow",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(14px,2.4vh,26px); padding:clamp(14px,3vh,32px) 16px;
    overflow:hidden;
  }

  /* The backdrop is a frame from the game itself, blurred back so the phone reads
     as the sharp thing on top of it. */
  .backdrop{position:fixed; inset:0; z-index:0; overflow:hidden}
  .backdrop img{
    width:100%; height:100%; object-fit:cover; object-position:center 58%;
    filter:blur(5px) saturate(1.2) brightness(.92) contrast(1.05); transform:scale(1.06);
  }
  /* Darken only behind the phone, so the road and the mountains still read at the edges. */
  .backdrop::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(46% 66% at 50% 52%, rgba(12,8,25,.86) 0%, rgba(12,8,25,.52) 52%, rgba(12,8,25,0) 100%),
      linear-gradient(180deg, rgba(12,8,25,.70) 0%, rgba(12,8,25,.10) 22%, rgba(12,8,25,.12) 70%, rgba(12,8,25,.72) 100%);
  }

  header,footer{position:relative; z-index:1; text-align:center; flex:0 0 auto}

  .wordmark{
    font-family:"Anton",sans-serif; font-size:clamp(26px,4.4vh,40px);
    letter-spacing:.04em; color:var(--lime); margin:0; line-height:1;
  }
  .tagline{
    margin:8px 0 0; font-size:13px; font-weight:500; color:var(--muted);
    letter-spacing:.02em; max-width:46ch;
  }

  /* The phone keeps its 390×844 shape at every screen size; when the window is
     shorter than that, the whole thing scales down rather than getting cropped. */
  .stage{
    position:relative; z-index:1; flex:0 1 auto;
    width:calc(var(--phone-w) * var(--scale));
    height:calc(var(--phone-h) * var(--scale));
  }
  .phone{
    position:absolute; top:0; left:0;
    width:var(--phone-w); height:var(--phone-h);
    transform:scale(var(--scale)); transform-origin:top left;
    border-radius:36px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:
      0 0 0 7px #05030c,
      0 0 0 8px rgba(180,157,255,.14),
      0 42px 90px -28px rgba(0,0,0,.92),
      0 0 120px -40px rgba(139,108,240,.5);
  }
  .phone iframe{width:100%; height:100%; border:0; display:block; background:var(--ink)}

  .links{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:0}
  .links a{
    display:inline-flex; align-items:center; gap:7px;
    padding:8px 15px; border-radius:999px; text-decoration:none;
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--line);
    background:rgba(12,8,25,.62); backdrop-filter:blur(8px);
    transition:color .18s, border-color .18s;
  }
  .links a:hover{color:var(--lime); border-color:rgba(201,245,61,.5)}
  .note{margin:9px 0 0; font-size:11px; color:#6a5f96; letter-spacing:.03em}

  /* On a phone the browser already is the device — drop the frame and fill the screen. */
  @media (max-width:520px){
    body{padding:0; gap:0; justify-content:flex-start}
    header,footer{display:none}
    .backdrop{display:none}
    .stage{width:100%; height:100dvh}
    .phone{
      position:static; width:100%; height:100dvh; transform:none;
      border:0; border-radius:0; box-shadow:none;
    }
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <img src="scene-bg.webp" alt="" fetchpriority="high" decoding="async">
</div>

<header>
  <h1 class="wordmark">OVERSTEER</h1>
  <p class="tagline">A crash game told through a drift car. Nobody steers — the only decision is when to cash out.</p>
</header>

<div class="stage" id="stage">
  <div class="phone">
    <iframe src="game.html" title="OVERSTEER, playable prototype" allow="autoplay"></iframe>
  </div>
</div>

<footer>
  <p class="links">
    <a href="/work/oversteer">Read the case</a>
    <a href="/">jimtsipoutas.com</a>
  </p>
  <p class="note">Playable prototype · credits are not money</p>
</footer>

<script>
  // Fit the 390×844 phone to whatever height is left, never scaling it up.
  var stage = document.getElementById('stage');
  function fit(){
    if (window.matchMedia('(max-width:520px)').matches){
      document.documentElement.style.setProperty('--scale', '1');
      return;
    }
    var used = 0;
    document.querySelectorAll('header, footer').forEach(function(el){
      used += el.getBoundingClientRect().height;
    });
    var gap = parseFloat(getComputedStyle(document.body).rowGap) || 0;
    var pad = parseFloat(getComputedStyle(document.body).paddingTop) * 2 || 0;
    var room = window.innerHeight - used - gap * 2 - pad;
    var scale = Math.min(1, room / 844, (window.innerWidth - 32) / 390);
    document.documentElement.style.setProperty('--scale', String(Math.max(0.4, scale)));
  }
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
</script>

</body>
</html>
