<title>OVERSTEER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#07050f;
  --deep:#0c0819;
  --panel:#150f2b;
  --panel-2:#1d1540;
  --line:#2c2054;
  --line-soft:#1f1743;
  --lime:#c9f53d;
  --lime-deep:#93bd12;
  --violet:#8b6cf0;
  --violet-hi:#b49dff;
  --violet-deep:#4a2f9e;
  --red:#ff3d45;
  --red-hi:#ff7b80;
  --amber:#ffab35;
  --text:#f1eeff;
  --muted:#9a90c4;
  --muted-2:#6a5f96;
  --f-d:"Anton",Impact,"Barlow",sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,sans-serif;
}
html,body{height:100%;}
body{
  /* A standalone page gets no reset from a host, and the UA's default 8px body
     margin pushes the bottom nav off a 844px-tall viewport. */
  margin:0;
  background:radial-gradient(1100px 620px at 50% -8%, #241a52 0%, rgba(8,6,18,0) 62%), var(--ink);
  color:var(--text);
  font-family:var(--f-b);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
button,input{font-family:inherit;color:inherit;}
button{cursor:pointer;background:none;border:0;padding:0;}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}

#app{
  position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#120c26 0%,#0c0819 52%,#08050f 100%);
  box-shadow:0 0 0 1px rgba(139,108,240,.16), 0 40px 120px rgba(0,0,0,.85);
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}

/* ---------------- top bar ---------------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:9px 15px 7px;padding-top:calc(9px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line-soft);
}
/* The wordmark is the brand asset, not type - the skew and the chrome are baked
   into the image, so it must never be rebuilt out of a font. */
.wordmark{
  height:26px;width:auto;display:block;
  filter:drop-shadow(0 0 14px rgba(201,245,61,.30));
}
.wordmark.big{height:44px;max-width:86%;margin-inline:auto;}   /* a block img no longer centres on its own */
.wallet{display:flex;align-items:center;gap:7px;}
.wallet .stack{width:15px;height:15px;flex:0 0 15px;}
.wallet .stack path{fill:var(--lime);}
.wbox{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;}
.wlabel{font-size:8px;letter-spacing:.2em;color:var(--muted-2);font-weight:700;}
.wval{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);}

/* ---------------- status ---------------- */
.statusrow{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:6px 15px;
  font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--muted);
}
.live{display:flex;align-items:center;gap:6px;color:var(--violet-hi);}
.live i{width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 9px var(--violet);animation:blip 1.3s infinite;}
.live.idle{color:var(--muted-2);} .live.idle i{background:var(--muted-2);box-shadow:none;animation:none;}
.live.open{color:var(--lime);} .live.open i{background:var(--lime);box-shadow:0 0 9px var(--lime);}
.live.dead{color:var(--red-hi);} .live.dead i{background:var(--red);box-shadow:0 0 9px var(--red);}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.round{margin-left:auto;color:var(--muted);} .round b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
.seed{color:var(--muted-2);letter-spacing:.06em;}

/* ---------------- stage ---------------- */
.stage{
  position:relative;flex:1 1 auto;min-height:268px;background:#07050f;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  overflow:hidden;touch-action:none;
}
#gl{display:block;width:100%;height:100%;}
.stage-ui{position:absolute;inset:0;pointer-events:none;}
.vig{position:absolute;inset:0;background:radial-gradient(118% 78% at 50% 44%, rgba(0,0,0,0) 44%, rgba(5,3,12,.78) 100%);}
.tint{position:absolute;inset:0;opacity:0;transition:opacity .35s;}
.tint.crash{opacity:1;background:radial-gradient(90% 70% at 50% 46%, rgba(255,61,69,.34) 0%, rgba(120,10,26,.62) 100%);}
.tint.win{opacity:1;background:radial-gradient(90% 70% at 50% 46%, rgba(201,245,61,.22) 0%, rgba(40,70,0,.5) 100%);}

.hero{position:absolute;left:0;right:0;top:16px;text-align:center;}
.hero .tag{margin-top:5px;font-size:9px;letter-spacing:.42em;color:var(--muted);font-weight:700;}

.readout{position:absolute;left:0;right:0;top:12px;text-align:center;}
.kicker{font-size:10px;letter-spacing:.28em;font-weight:700;color:var(--red-hi);height:13px;opacity:0;transition:opacity .2s;}
.kicker.on{opacity:1;}
.multi{
  font-size:52px;line-height:1.02;font-weight:800;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;color:var(--violet-hi);
  text-shadow:0 0 30px rgba(139,108,240,.75);
  transition:color .18s,text-shadow .18s;
}
.multi.locked{color:var(--lime);text-shadow:0 0 32px rgba(201,245,61,.6);}
.multi.danger{color:var(--amber);text-shadow:0 0 32px rgba(255,171,53,.6);}
.multi.dead{color:var(--red);text-shadow:0 0 36px rgba(255,61,69,.75);}
.multi.idle{opacity:.3;}
.state{margin-top:2px;font-size:10px;letter-spacing:.26em;font-weight:700;color:var(--violet-hi);transition:color .16s;}
.state.good{color:var(--lime);} .state.warn{color:var(--amber);} .state.bad{color:var(--red-hi);} .state.mute{color:var(--muted);}

.speedo{position:absolute;right:13px;top:13px;text-align:right;}
.speedo b{display:block;font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
.speedo span{font-size:8px;letter-spacing:.2em;color:var(--muted-2);font-weight:700;}

.meters{position:absolute;left:13px;right:13px;bottom:11px;display:flex;flex-direction:column;gap:7px;}
.meter{display:flex;align-items:center;gap:8px;}
.meter .mlab{font-size:8px;letter-spacing:.2em;font-weight:700;color:var(--muted-2);width:38px;flex:0 0 38px;}
.meter .mlab.r{text-align:right;}
.segs{flex:1 1 auto;display:flex;gap:2px;height:8px;}
.segs i{flex:1 1 0;background:rgba(255,255,255,.08);transition:background .1s;}
.segs i.f{background:var(--lime);box-shadow:0 0 7px rgba(201,245,61,.5);}
.segs i.f.mid{background:var(--amber);box-shadow:0 0 7px rgba(255,171,53,.5);}
.segs i.f.low{background:var(--red);box-shadow:0 0 7px rgba(255,61,69,.5);}
.segs i.f.v{background:var(--violet);box-shadow:0 0 7px rgba(139,108,240,.5);}
.mval{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);width:40px;flex:0 0 40px;text-align:right;}

.countdown{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-bottom:12%;}
.countdown .bets{font-family:var(--f-d);font-size:26px;letter-spacing:.10em;color:var(--lime);
  text-shadow:0 0 22px rgba(201,245,61,.55);margin-bottom:2px;}
.countdown .cl{font-size:9px;letter-spacing:.34em;font-weight:700;color:var(--muted);}
.countdown .cn{font-family:var(--f-d);font-size:92px;line-height:1;color:#fff;text-shadow:0 0 44px rgba(139,108,240,.9);}

/* ---------------- history strip ---------------- */
.histstrip{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:7px 15px;
  overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line-soft);
}
.histstrip::-webkit-scrollbar{display:none;}
.hlabel{font-size:8px;letter-spacing:.2em;color:var(--muted-2);font-weight:700;flex:0 0 auto;margin-right:2px;}
.chip{
  flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:3px 7px;background:rgba(255,61,69,.12);color:var(--red-hi);border:1px solid rgba(255,61,69,.28);
}
.chip.win{background:rgba(201,245,61,.12);color:var(--lime);border-color:rgba(201,245,61,.3);}

/* ---------------- panel ---------------- */
.panel{flex:0 0 auto;padding:9px 15px 7px;display:flex;flex-direction:column;gap:8px;}

.stakerow{display:flex;align-items:center;gap:8px;}
.stakebox{
  flex:1 1 0;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);height:46px;
}
.stakebox .slab{font-size:8px;letter-spacing:.2em;font-weight:700;color:var(--muted-2);padding-left:11px;}
.stakebox button{width:38px;flex:0 0 38px;height:100%;font-size:20px;font-weight:700;color:var(--lime);}
.stakebox button:active{background:rgba(201,245,61,.1);}
.stakebox input{
  flex:1 1 0;min-width:0;width:100%;background:none;border:0;text-align:center;
  font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lime);
}
.stakebox input:disabled{color:var(--muted);}
.cashbtn{
  flex:1.35 1 0;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--lime);color:#0d1400;border:1px solid var(--lime);
  box-shadow:0 0 0 1px rgba(201,245,61,.2),0 8px 24px rgba(201,245,61,.2);
}
.cashbtn .cl{font-size:9px;letter-spacing:.2em;font-weight:800;opacity:.72;}
.cashbtn .cv{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;}
.cashbtn:disabled{background:var(--panel);border-color:var(--line);color:var(--muted-2);box-shadow:none;cursor:default;}
.cashbtn:not(:disabled){animation:pulse 1.15s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(201,245,61,.2),0 8px 24px rgba(201,245,61,.18)}50%{box-shadow:0 0 0 1px rgba(201,245,61,.55),0 8px 32px rgba(201,245,61,.42)}}

.chips{display:flex;gap:6px;}
.chips button{
  flex:1 1 0;height:28px;background:var(--panel);border:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;
}
.chips button.on{border-color:var(--lime);color:var(--lime);background:rgba(201,245,61,.1);}
.chips button:disabled{opacity:.4;}

.autorow{
  display:flex;align-items:center;gap:10px;height:38px;padding:0 11px;
  background:var(--panel);border:1px solid var(--line);
}
.switch{position:relative;width:32px;height:17px;flex:0 0 32px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);transition:background .16s,border-color .16s;}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--muted-2);transition:transform .16s,background .16s;}
.switch[aria-checked="true"]{background:rgba(139,108,240,.3);border-color:var(--violet);}
.switch[aria-checked="true"]::after{transform:translateX(15px);background:var(--violet-hi);}
.autorow .alab{flex:1 1 auto;font-size:10px;letter-spacing:.16em;font-weight:700;color:var(--muted);}
.autoval{display:flex;align-items:center;gap:2px;}
.autoval button{width:24px;height:26px;font-size:16px;font-weight:700;color:var(--muted);}
.autoval button:active{color:var(--violet-hi);}
.autoval input{width:56px;background:none;border:0;text-align:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--violet-hi);}
.autorow.off .autoval{opacity:.35;}

.cta{
  height:50px;width:100%;font-family:var(--f-d);font-size:19px;letter-spacing:.09em;
  background:var(--lime);color:#0d1400;border:1px solid var(--lime);
  box-shadow:0 8px 26px rgba(201,245,61,.2);transition:background .14s,box-shadow .14s;
}
.cta[data-kind="again"]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 26px rgba(255,61,69,.26);}
.cta[data-kind="again-win"]{background:var(--lime);border-color:var(--lime);color:#0d1400;}
.cta[data-kind="placed"]{background:var(--panel);border-color:var(--violet);color:var(--violet-hi);box-shadow:none;}
.cta:disabled{background:var(--panel);border-color:var(--line);color:var(--muted-2);box-shadow:none;cursor:default;}
.cta:active:not(:disabled){transform:translateY(1px);}

.resultcard{display:flex;background:var(--panel);border:1px solid var(--line);height:56px;}
.resultcard > div{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.resultcard > div + div{border-left:1px solid var(--line);}
.resultcard .rl{font-size:8px;letter-spacing:.2em;font-weight:700;color:var(--muted-2);}
.resultcard .rv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:center;gap:4px;}
.resultcard.loss .rv.main{color:var(--red);}
.resultcard.win .rv.main{color:var(--lime);}
.resultcard .rv.peak{color:var(--text);}
.resultcard .stack{width:13px;height:13px;}
.resultcard.loss .stack path{fill:var(--red);}
.resultcard.win .stack path{fill:var(--lime);}

.ghostbtn{
  height:38px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel);border:1px solid var(--line);
  font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--muted);
}
.ghostbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;}


/* ---------------- nav ---------------- */
.nav{flex:0 0 auto;display:flex;border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(10,7,22,.92);}
.nav button{flex:1 1 0;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:8px;letter-spacing:.14em;font-weight:700;color:var(--muted-2);}
.nav button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;}
.nav button.on{color:var(--lime);}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(201,245,61,.6));}

/* ---------------- sheet ---------------- */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(5,3,12,.88);display:flex;flex-direction:column;justify-content:flex-end;}
.sheet-body{background:var(--deep);border-top:1px solid var(--line);max-height:76%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 10px;border-bottom:1px solid var(--line-soft);}
.sheet-head h2{margin:0;font-family:var(--f-d);font-size:16px;letter-spacing:.09em;}
.sheet-head button{font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--muted);}
.rows{overflow-y:auto;}
.row{display:grid;grid-template-columns:48px 1fr 62px 66px;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line-soft);font-size:12px;font-variant-numeric:tabular-nums;}
.row .rid{color:var(--muted-2);font-weight:600;}
.row .rwhy{color:var(--muted);font-size:9px;letter-spacing:.14em;font-weight:700;}
.row .rmul{font-weight:800;text-align:right;}
.row .rpay{text-align:right;font-weight:700;}
.row.win .rmul,.row.win .rpay{color:var(--lime);}
.row.loss .rmul,.row.loss .rpay{color:var(--red-hi);}
.empty{padding:26px 15px;text-align:center;color:var(--muted-2);font-size:12px;}

.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:var(--panel-2);border:1px solid var(--line);padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.06em;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;}}
</style>

/* ONE endless right-hand corner. The centreline is a closed circle, so the
   drift never ends: the player rides the same apex for as long as they dare.
   Length is chosen to be a whole number of texture repeats (912 = 57*16 = 228*4)
   so the loop seam is invisible. */
var TRACK_LEN=912;                       // m, one lap
var RADIUS=TRACK_LEN/(Math.PI*2);        // 145.15 m
var CURV=1/RADIUS;                       // constant right-hand curvature
var LINE=3.2;                            // racing line: hugging the inside kerb

function buildCircle(){
  var n=Math.round(TRACK_LEN/SEG);
  var px=new Float32Array(n),pz=new Float32Array(n),ph=new Float32Array(n);
  var x=0,z=0,h=0;
  for(var i=0;i<n;i++){
    px[i]=x;pz[i]=z;ph[i]=h;
    h-=CURV*SEG;                          // heading falls => turning right
    x+=Math.sin(h)*SEG; z+=Math.cos(h)*SEG;
  }
  return {x:px,z:pz,h:ph,n:n,len:n*SEG};
}
var T=buildCircle();
function fwdX(h){return Math.sin(h);} function fwdZ(h){return Math.cos(h);}
function rgtX(h){return -Math.cos(h);} function rgtZ(h){return Math.sin(h);}
function wrapS(s){s%=T.len;return s<0?s+T.len:s;}
function sampleAt(s){
  s=wrapS(s);
  var f=s/SEG, i=(f|0)%T.n, t=f-(f|0), j=(i+1)%T.n;
  var dh=T.h[j]-T.h[i];
  while(dh>Math.PI)dh-=TAU; while(dh<-Math.PI)dh+=TAU;
  return {x:lerp(T.x[i],T.x[j],t),z:lerp(T.z[i],T.z[j],t),h:T.h[i]+dh*t,cs:CURV,target:LINE};
}

function tex(w,h,draw,repX,repY){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  var t=new THREE.CanvasTexture(c);
  t.wrapS=repX?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;
  t.wrapT=repY?THREE.RepeatWrapping:THREE.ClampToEdgeWrapping;
  t.anisotropy=8;t.encoding=THREE.sRGBEncoding;
  return t;
}
// 12 m across x 16 m along: wet asphalt, solid edges, dashed centre
var asphaltTex=tex(256,512,function(g,w,h){
  g.fillStyle='#15131f';g.fillRect(0,0,w,h);
  var i,x,y;
  for(i=0;i<2800;i++){
    x=Math.random()*w;y=Math.random()*h;
    g.fillStyle=Math.random()<0.5?'rgba(210,205,255,0.03)':'rgba(0,0,0,0.32)';
    g.fillRect(x,y,1+Math.random()*2.2,1+Math.random()*2.2);
  }
  for(i=0;i<26;i++){                       // wet sheen
    x=Math.random()*w;y=Math.random()*h;var r=20+Math.random()*58;
    var gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(150,140,220,0.10)');gr.addColorStop(1,'rgba(150,140,220,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }

  g.fillStyle='rgba(255,214,90,0.8)';       // warm centre dashes, like the reference
  g.fillRect(w*0.5-3,0,6,h*0.5);
  g.fillStyle='rgba(0,0,0,0.3)';
  g.fillRect(w*0.25,0,1,h);g.fillRect(w*0.75,0,1,h);
},false,true);

/* ---- low-poly mountain ring, parked on the horizon ---- */
var mountains=new THREE.Group();
(function(){
  var rnd=mulberry32(77021);
  // crumple a cone so every face catches the light differently - the reference look
  function peak(rad,hgt,sides){
    var g=new THREE.ConeGeometry(rad,hgt,sides,3);
    var pos=g.attributes.position, apex=hgt/2;
    for(var i=0;i<pos.count;i++){
      var y=pos.getY(i);
      if(apex-y<0.001)continue;                  // leave the summit sharp
      var f=0.62+rnd()*0.72;
      pos.setX(i,pos.getX(i)*f);
      pos.setZ(i,pos.getZ(i)*f);
      pos.setY(i,y+(rnd()-0.5)*hgt*0.16);
    }
    g.computeVertexNormals();
    return g;
  }
  var near=new THREE.MeshStandardMaterial({color:0x3b2f7e,roughness:0.92,metalness:0.06,flatShading:true,fog:false});
  var mid =new THREE.MeshStandardMaterial({color:0x2a2160,roughness:0.95,metalness:0.04,flatShading:true,fog:false});
  var far =new THREE.MeshStandardMaterial({color:0x1b1544,roughness:1,metalness:0,flatShading:true,fog:false});
  function mergeAll(list){
    var P=[],N=[],I=[],off=0;
    list.forEach(function(g){
      var p=g.attributes.position,nn=g.attributes.normal,i;
      for(i=0;i<p.count;i++){P.push(p.getX(i),p.getY(i),p.getZ(i));N.push(nn.getX(i),nn.getY(i),nn.getZ(i));}
      if(g.index){for(i=0;i<g.index.count;i++)I.push(g.index.getX(i)+off);}
      else{for(i=0;i<p.count;i++)I.push(i+off);}
      off+=p.count;
    });
    var out=new THREE.BufferGeometry();
    out.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
    out.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
    out.setIndex(I);
    return out;
  }
  var bands=[[],[],[]], D=new THREE.Object3D();
  for(var i=0;i<96;i++){
    var a=(i/96)*TAU+rnd()*0.07;
    var b=rnd(), bi=b<0.34?0:(b<0.7?1:2);
    var d=bi===0?(300+rnd()*150):(bi===1?(470+rnd()*200):(700+rnd()*380));
    var hgt=(bi===0?80:bi===1?140:210)+rnd()*(bi===0?70:bi===1?120:190);
    var g=peak(hgt*(0.42+rnd()*0.4),hgt,5+((rnd()*4)|0));
    D.position.set(Math.cos(a)*d,hgt*0.5-30,Math.sin(a)*d);
    D.rotation.set(0,rnd()*TAU,0);D.scale.set(1,1,1);D.updateMatrix();
    g.applyMatrix4(D.matrix);
    bands[bi].push(g);
  }
  [near,mid,far].forEach(function(mat,k){
    if(!bands[k].length)return;
    var m=new THREE.Mesh(mergeAll(bands[k]),mat);
    m.frustumCulled=false;mountains.add(m);
  });
})();
scene.add(mountains);

(function buildSea(){

  var p=g.attributes.position, rnd=mulberry32(3311);

  sea.position.y=-26;sea.frustumCulled=false;scene.add(sea);
})();

/* ---- roadside: a low cut-rock wall on the inside, the drop on the outside.
        Kept deliberately small - the background peaks are the mountain, this just
        edges the road so it does not float. ---- */
(function buildRoadside(){
  var n=T.n, IN=HALF_W+SHOULDER;
  function jit(q,r,k){var v=Math.sin(q*12.9898+r*78.233+k*37.719)*43758.5453;return (v-Math.floor(v))-0.5;}

  function band(prof){
    var rows=prof.length, pos=[], col=[], idx=[];
    for(var i=0;i<=n;i++){
      var q=i%n, x=T.x[q], z=T.z[q], h=T.h[q], rx=rgtX(h), rz=rgtZ(h);
      for(var r=0;r<rows;r++){
        var o=prof[r][0], y=prof[r][1], j=prof[r][2], c=prof[r][3];
        o+=jit(q,r,1)*j; y+=jit(q,r,7)*j;
        pos.push(x+rx*o,y,z+rz*o);
        col.push(((c>>16)&255)/255,((c>>8)&255)/255,(c&255)/255);
      }
      if(i<n){
        for(var r2=0;r2<rows-1;r2++){
          var A=i*rows+r2, B=A+1, C=A+rows, D=C+1;
          idx.push(A,C,B, B,C,D);
        }
      }
    }
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.setIndex(idx);g.computeVertexNormals();
    var m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({
      vertexColors:true,roughness:0.95,metalness:0.04,flatShading:true,
      side:THREE.DoubleSide}));          // the two sides wind opposite ways - never cull
    m.frustumCulled=false;scene.add(m);
  }

  // inside: a cut face about a car and a half tall, ragged along the top
  band([
    [IN,        -0.05, 0.00, 0x2e2b4a],
    [IN+0.35,    1.30, 0.10, 0x393663],
    [IN+0.95,    3.10, 0.22, 0x444075],
    [IN+2.10,    4.40, 0.55, 0x4b4783],
    [IN+4.60,    3.60, 0.90, 0x334a39],
    [IN+11,      0.60, 1.60, 0x2b4234],
    [IN+26,     -7.50, 2.60, 0x24344a],
    [IN+52,    -17.50, 3.40, 0x1c2942],
    [IN+96,    -23.00, 3.80, 0x172440]
  ]);

  // outside: the drop the car goes over
  band([
    [-IN,        -0.05, 0.00, 0x2b2a4e],
    [-(IN+1.6),  -5.00, 0.60, 0x211f3f],
    [-(IN+5.0), -13.00, 1.60, 0x1a1833],
    [-(IN+12),  -21.00, 2.60, 0x171533],
    [-(IN+34),  -26.50, 3.40, 0x141228]
  ]);

  // a few small pines peeking over the wall
  var rnd=mulberry32(9182), D=new THREE.Object3D();
  var pines=new THREE.InstancedMesh(new THREE.ConeGeometry(0.75,2.1,6,1),
    new THREE.MeshStandardMaterial({color:0x2a4a30,roughness:0.95,flatShading:true}),200);
  var pc=0;
  for(var i=0;i<T.n;i+=6){
    if(pc>=200||rnd()<0.55)continue;
    var x=T.x[i],z=T.z[i],h=T.h[i],rx=rgtX(h),rz=rgtZ(h);
    var o=IN+2.6+rnd()*2.6, sc=0.8+rnd()*0.8;
    D.position.set(x+rx*o,4.1+rnd()*0.5+sc*1.05,z+rz*o);
    D.rotation.set(0,rnd()*TAU,0);D.scale.set(sc,sc,sc);
    D.updateMatrix();pines.setMatrixAt(pc++,D.matrix);
  }
  pines.count=pc;pines.frustumCulled=false;scene.add(pines);
})();

/* ---- road deck ---- */
(function buildRoad(){
  var n=T.n,i;
  var pos=[],uv=[],idx=[], sPos=[],sUv=[],sIdx=[], wPos=[],wIdx=[], kPos=[],kUv=[],kIdx=[];
  for(i=0;i<=n;i++){                       // n+1 rows: the last one closes the loop
    var q=i%n, x=T.x[q],z=T.z[q],h=T.h[q],rx=rgtX(h),rz=rgtZ(h);
    var d=i*SEG, v=d/16, SO=HALF_W+SHOULDER;
    pos.push(x-rx*HALF_W,0,z-rz*HALF_W, x+rx*HALF_W,0,z+rz*HALF_W);
    uv.push(0,v, 1,v);
    sPos.push(x-rx*SO,-0.11,z-rz*SO, x-rx*HALF_W,-0.01,z-rz*HALF_W,
              x+rx*HALF_W,-0.01,z+rz*HALF_W, x+rx*SO,-0.11,z+rz*SO);
    sUv.push(0,v,1,v,0,v,1,v);
    wPos.push(x-rx*SO,-0.11,z-rz*SO, x-rx*SO,-DECK,z-rz*SO,
              x+rx*SO,-0.11,z+rz*SO, x+rx*SO,-DECK,z+rz*SO);
    // the apex kerb runs the whole inside edge - the corner never straightens
    var a=HALF_W-0.05, b=HALF_W+0.95;
    kPos.push(x+rx*a,0.016,z+rz*a, x+rx*b,0.105,z+rz*b);
    kUv.push(0,d/4, 1,d/4);
    if(i<n){
      var a0=i*2,b0=a0+1;
      idx.push(a0,b0,a0+2, b0,b0+2,a0+2);
      kIdx.push(a0,b0,a0+2, b0,b0+2,a0+2);
      var s0=i*4;
      sIdx.push(s0,s0+1,s0+4, s0+1,s0+5,s0+4, s0+2,s0+3,s0+6, s0+3,s0+7,s0+6);
      wIdx.push(s0+1,s0,s0+4, s0+1,s0+4,s0+5, s0+2,s0+3,s0+7, s0+2,s0+7,s0+6);
    }
  }
  function mk(p,u,ix,mat){
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    if(u)g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));
    g.setIndex(ix);g.computeVertexNormals();
    var m=new THREE.Mesh(g,mat);m.frustumCulled=false;scene.add(m);return m;
  }
  mk(pos,uv,idx,new THREE.MeshStandardMaterial({map:asphaltTex,roughness:0.38,metalness:0.2}));
  mk(sPos,sUv,sIdx,new THREE.MeshStandardMaterial({color:0x191430,roughness:0.95,side:THREE.DoubleSide}));
  mk(wPos,null,wIdx,new THREE.MeshStandardMaterial({color:0x0c0919,roughness:0.9,metalness:0.12,side:THREE.DoubleSide}));
  mk(kPos,kUv,kIdx,new THREE.MeshStandardMaterial({map:kerbTex,roughness:0.5,metalness:0.06}));
})();

/* ---- the LED edges that define the reference look ---- */
(function buildLeds(){
  var n=T.n, pos=[], idx=[], gpos=[], gidx=[];
  for(var i=0;i<=n;i++){
    var q=i%n, x=T.x[q], z=T.z[q], h=T.h[q], rx=rgtX(h), rz=rgtZ(h);
    for(var side=-1;side<=1;side+=2){
      var a=(HALF_W-0.1)*side, b=(HALF_W-0.85)*side;
      pos.push(x+rx*a,0.05,z+rz*a, x+rx*b,0.05,z+rz*b);
      var ga=(HALF_W+0.5)*side, gb=(HALF_W-1.9)*side;
      gpos.push(x+rx*ga,0.03,z+rz*ga, x+rx*gb,0.03,z+rz*gb);
    }
    if(i<n){
      for(var k=0;k<2;k++){
        var o=i*4+k*2;
        idx.push(o,o+1,o+4, o+1,o+5,o+4);
        gidx.push(o,o+1,o+4, o+1,o+5,o+4);
      }
    }
  }
  function strip(p,ix,mat){
    var g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
    g.setIndex(ix);
    var m=new THREE.Mesh(g,mat);m.frustumCulled=false;m.renderOrder=2;scene.add(m);
  }
  strip(pos,idx,new THREE.MeshBasicMaterial({color:0xc4a3ff,fog:false}));
  strip(gpos,gidx,new THREE.MeshBasicMaterial({color:0x8a5cff,transparent:true,opacity:0.55,
        blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
})();

/* ---- guardrail, lamps, chevrons ---- */
var railMesh,railPost,railData=[];
(function buildFurniture(){
  var railSpots=[],lampSpots=[],chevSpots=[],i;
  var lampEvery=24, railEvery=3, chevEvery=8;    // all divide T.n exactly -> seamless loop
  for(i=0;i<T.n;i++){
    var x=T.x[i],z=T.z[i],h=T.h[i],rx=rgtX(h),rz=rgtZ(h),edge=HALF_W+SHOULDER-0.25;
    // guardrail on the OUTSIDE only: the inside is kerb, then a drop
    if(i%railEvery===0)railSpots.push({x:x-rx*edge,z:z-rz*edge,h:h});
    if(i%lampEvery===0)lampSpots.push({x:x-rx*(edge+1.2),z:z-rz*(edge+1.2),h:h,side:-1});
    if(i%chevEvery===0)chevSpots.push({x:x-rx*(edge+0.45),z:z-rz*(edge+0.45),h:h});
  }
  var D=new THREE.Object3D();

  railMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.14,0.46,5.7),
    new THREE.MeshStandardMaterial({color:0x9d9ecb,roughness:0.34,metalness:0.8,emissive:0x4b2fb0,emissiveIntensity:1.15}),railSpots.length);
  railPost=new THREE.InstancedMesh(new THREE.BoxGeometry(0.16,0.95,0.16),
    new THREE.MeshStandardMaterial({color:0x453c66,roughness:0.75,metalness:0.4}),railSpots.length);
  for(i=0;i<railSpots.length;i++){

function taper(geo,fn){
  var p=geo.attributes.position;
  for(var i=0;i<p.count;i++){var v=fn(p.getX(i),p.getY(i),p.getZ(i));p.setXYZ(i,v[0],v[1],v[2]);}
  p.needsUpdate=true;geo.computeVertexNormals();return geo;
}

  var wg=new THREE.CylinderGeometry(0.45,0.45,0.38,14);wg.rotateZ(Math.PI/2);
  var rg=new THREE.CylinderGeometry(0.28,0.28,0.395,8);rg.rotateZ(Math.PI/2);

    new THREE.MeshBasicMaterial({map:smokeTex,color:0x000000,transparent:true,opacity:0.42,depthWrite:false}));

/* The whole round is decided here, before the car turns a wheel.
   Standard crash-game curve: P(crash point > m) = (1-edge)/m, so the expected
   return is a flat (1-edge) whatever multiplier the player aims for.
   HOUSE_EDGE 3%, plus a 2% instant-bust slice, exactly like the real thing. */
var HOUSE_EDGE=0.03, BUST_CHANCE=0.02;
function fnv(str){
  var h=2166136261;
  for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function crashFromSeed(seed){
  var rnd=mulberry32(fnv(seed));
  rnd();rnd();                               // discard, decorrelate from the seed bits
  var u=rnd();
  if(u<BUST_CHANCE)return 1.00;              // gone off the line before it ever hooked up
  u=(u-BUST_CHANCE)/(1-BUST_CHANCE);
  return Math.max(1.01,Math.min(500,Math.floor(((1-HOUSE_EDGE)/(1-u))*100)/100));
}

var BET_WINDOW=7.0, SETTLE_TIME=3.6;

/* The table runs on its own clock. Bets are taken during the window; miss it and
   you watch that run go by and queue for the next one. */
function openBetting(){
  G.phase='betting';G.betT=BET_WINDOW;
  G.t=0;G.s=20;G.v=0;G.lat=LINE;G.latVel=0;G.yaw=0;
  G.wob=0;G.moment=0;G.momentT=1.5;G.momentLeft=0;
  G.y=0;G.vy=0;G.roll=0;G.pitch=0;G.spin=0;G.grip=100;G.mult=1;G.peak=1;G.score=0;G.shake=0;
  for(var i=0;i<railData.length;i++)railData[i].hit=false;
  restoreRails();

  G.seed=hexbit(8);                        // next round's seed, fixed before any bet lands
  G.crashAt=crashFromSeed(G.seed);
  G.ns=(parseInt(G.seed.slice(0,4),16)/65535)*6.283;
  elSeed.textContent='seed '+G.seed.slice(0,4)+'\u00b7****';

  G.staked=G.queued;G.stakeAmt=G.queued?G.queuedAmt:0;G.queued=false;G.queuedAmt=0;

  elReadout.hidden=true;elMeters.hidden=true;elSpeedo.hidden=true;
  elHero.hidden=true;elCount.hidden=false;elTint.className='tint';
  elPlayCtl.hidden=false;elResCtl.hidden=true;
  elMulti.textContent='1.00x';elMulti.className='multi idle';
  elKicker.className='kicker';
  setState('BETS OPEN \u2014 NEXT RUN STARTING','mute');
  elLive.className='live open';elLiveTxt.textContent='BETS OPEN';
  elCash.disabled=true;elCashVal.textContent='\u2014';
  renderRound();
  refreshCta();
}
function refreshCta(){
  if(G.phase==='betting'){
    if(G.staked){setCta('placed','BET PLACED \u00b7 '+num(G.stakeAmt),true);stakeLocked(true);}
    else{setCta('lock','LOCK IN STAKE',false);stakeLocked(false);}
  }else{
    if(G.queued){setCta('placed','QUEUED \u00b7 '+num(G.queuedAmt),true);stakeLocked(true);}
    else{setCta('next','BET NEXT RUN',false);stakeLocked(false);}
  }
}
function placeBet(){
  if(G.bet>G.balance){toast('Not enough credits');return;}
  G.balance-=G.bet;renderWallet();
  if(G.phase==='betting'){G.staked=true;G.stakeAmt=G.bet;}
  else{G.queued=true;G.queuedAmt=G.bet;}
  refreshCta();save();
}
function goLive(){
  G.phase='live';G.t=0;G.v=38;G.s=20;G.lat=LINE;G.latVel=-0.4;G.yaw=-0.30;
  G.wob=0;G.moment=0;G.momentT=1.8+Math.random()*2.2;G.momentLeft=0;
  elCount.hidden=true;elReadout.hidden=false;elMeters.hidden=false;elSpeedo.hidden=false;
  elLive.className='live';elLiveTxt.textContent='LIVE';
  elMulti.className='multi';

  setState(G.staked?'DRIFT LOCKED':'SPECTATING \u2014 NO BET THIS RUN',G.staked?'good':'mute');

}
function cashOut(auto){
  if(G.phase!=='live'||!G.staked)return;
  G.payout=Math.round(G.stakeAmt*G.mult);
  G.balance+=G.payout;renderWallet();
  G.reason=auto?'AUTO CASH OUT':'CASH OUT';
  var stake=G.stakeAmt;G.cashedAt=G.mult;G.staked=false;
  elTint.className='tint win';
  elMulti.className='multi';
  elKicker.className='kicker on';elKicker.style.color='var(--lime)';
  elKicker.textContent='YOU CASHED AT '+G.cashedAt.toFixed(2)+'x';
  setState('BANKED '+num(G.payout)+' \u2014 RUN CONTINUES','good');
  elCash.disabled=true;elCashVal.textContent='\u2014';
  logRound(true,G.payout-stake);
  refreshCta();
  toast('Banked '+num(G.payout));
}
function crash(){
  if(G.phase!=='live')return;
  G.phase='crashing';G.overT=0;G.grip=0;
  G.mult=G.crashAt;G.peak=G.crashAt;      // settle exactly on the published point
  // losing a right-hand drift always throws the car wide: left, over the edge
  G.reason='OVER THE EDGE';
  G.spin=-(1.2+Math.random()*1.1);
  elTint.className='tint crash';
  elMulti.className='multi dead';
  elKicker.className='kicker on';elKicker.style.color='var(--red-hi)';
  elKicker.textContent='OVER THE EDGE AT';
  setState('BETTER LUCK NEXT RUN','bad');
  elLive.className='live dead';elLiveTxt.textContent='CRASH';
  elCash.disabled=true;elCashVal.textContent='\u2014';
  G.shake=1;breakRail();updateHud();
  if(G.staked){G.staked=false;logRound(false,-G.stakeAmt);}
  else if(!G.loggedThisRound)logRound(null,0);
}

  G.phase='settle';G.settleT=SETTLE_TIME;

  elPlayCtl.hidden=true;elResCtl.hidden=false;
  var won=G.lastWon===true;
  elResCard.className='resultcard '+(G.lastWon===null?'':(won?'win':'loss'));
  if(G.lastWon===null){
    elRAmt.innerHTML='<span style="color:var(--muted-2);font-size:15px">NO BET</span>';
    elRPeakLabel.textContent='CRASHED AT';
  }else{
    elRAmt.innerHTML=(won?'+':'\u2212')+num(Math.abs(G.lastPay))+' <svg class="stack" aria-hidden="true"><use href="#stack"/></svg>';
    elRPeakLabel.textContent=won?'CASHED':'CRASHED AT';

function logRound(won,pay){
  G.loggedThisRound=true;
  G.lastWon=won;G.lastPay=pay;
  if(won!==null){
    G.log.unshift({id:G.round,m:won?G.cashedAt:G.crashAt,won:won,why:G.reason,pay:pay,score:Math.round(G.score)});
    G.log=G.log.slice(0,40);

function closeRound(){                       // every round lands in the strip, bet or not
  G.history.unshift({m:G.crashAt,won:G.lastWon===true});
  G.history=G.history.slice(0,24);
  G.round++;renderHistory();save();
}

function breakRail(){
  var cx=car.position.x,cz=car.position.z,hits=0;
  for(var i=0;i<railData.length&&hits<3;i++){
    var r=railData[i];if(r.hit)continue;
    var dx=r.x-cx,dz=r.z-cz;
    if(dx*dx+dz*dz<80){
      r.hit=true;hits++;
      r.vx=dx*0.4+(Math.random()-0.5)*3;r.vz=dz*0.4+(Math.random()-0.5)*3;
      r.vy=3.5+Math.random()*4;r.spin=(Math.random()-0.5)*7;
    }
  }
}
var D2=new THREE.Object3D();
function restoreRails(){
  for(var i=0;i<railData.length;i++){
    var r=railData[i];
    if(r.y===0.72&&r.rot===0)continue;
    r.y=0.72;r.rot=0;r.vx=r.vy=r.vz=r.spin=0;
    D2.position.set(r.x,0.72,r.z);D2.rotation.set(0,r.h,0);D2.scale.set(1,1,1);D2.updateMatrix();
    railMesh.setMatrixAt(i,D2.matrix);
  }
  railMesh.instanceMatrix.needsUpdate=true;
}

/* ==================================================================
   8. SIMULATION
   ================================================================== */
function step(dt){
  if(G.phase==='betting'){
    G.betT-=dt;
    elCountNum.textContent=G.betT>0.95?String(Math.ceil(G.betT)):'GO';
    if(elBetsMsg)elBetsMsg.style.opacity=G.betT>0.95?'1':'0';
    G.v=lerp(G.v,G.betT<1.6?16:7,dt*1.6);G.s=wrapS(G.s+G.v*dt);
    if(G.betT<=-0.3){G.loggedThisRound=false;G.lastWon=null;G.lastPay=0;goLive();}
  }
  else if(G.phase==='settle'){
    G.settleT-=dt;
    G.v=Math.max(0,G.v-14*dt);
    if(G.y<0){G.vy-=26*dt;G.y+=G.vy*dt;G.roll+=dt*1.6;G.yaw+=G.spin*dt;}
    else G.s=wrapS(G.s+G.v*dt);
    if(G.settleT<=0){closeRound();openBetting();}
  }
  else if(G.phase==='live'){
    G.t+=dt;
    G.v=Math.min(58,38+G.t*0.62);
    G.wob+=dt;

    /* ---- the multiplier is pure time, nothing else touches it ---- */
    G.mult=Math.exp(0.088*G.t);
    G.peak=G.mult;

    /* ---- "moments": the car runs wide, looks lost, gathers it back up.
            Pure theatre on a timer of its own - it never decides the round,
            so a scare tells the player nothing about the crash point. ---- */
    G.momentT-=dt;
    if(G.momentT<=0&&G.momentLeft<=0){
      G.momentT=1.9+Math.random()*4.0;
      G.momentDur=0.65+Math.random()*0.95;
      G.momentAmp=0.45+Math.random()*0.75;
      G.momentLeft=G.momentDur;
    }
    if(G.momentLeft>0){
      G.momentLeft-=dt;
      var ph=1-Math.max(0,G.momentLeft)/G.momentDur;
      G.moment=Math.sin(ph*Math.PI)*G.momentAmp;
    }else G.moment=0;

    /* ---- the driven line: smooth wander around the apex, pushed wide by a moment ---- */
    var w=G.wob, ns=G.ns;
    var wander=Math.sin(w*0.77+ns)*0.6+Math.sin(w*1.93+ns*2.1)*0.27+Math.sin(w*3.7+ns*0.7)*0.11;
    var amp=1.15+Math.min(1.3,G.t*0.04);
    var want=clamp(LINE+wander*amp-G.moment*3.0,-4.6,5.2);
    G.latVel+=(want-G.lat)*8.0*dt;
    G.latVel*=Math.pow(0.9,dt*60);
    G.lat=clamp(G.lat+G.latVel*dt,-5.4,5.4);

    /* ---- grip gauge: reads the moment, never the crash point ---- */
    G.grip=clamp(90+Math.sin(w*1.31+ns*3)*8-G.moment*56,5,100);

    var label,cls;
    if(G.moment>0.55){label='SNAPPING LOOSE';cls='bad';}
    else if(G.moment>0.2){label='GATHERING IT UP';cls='warn';}
    else if(Math.abs(G.lat-LINE)<1.7){label='DRIFT LOCKED';cls='good';}
    else{label='HOLDING THE SLIDE';cls='';}
    setState(label,cls);
    G.shake=G.moment>0.5?Math.min(1,(G.moment-0.5)*1.3):Math.max(0,G.shake-dt*1.8);

    G.score+=G.v*dt*(1.1+Math.abs(G.yaw)*7.0);
    G.s=wrapS(G.s+G.v*dt);

    /* ---- slip angle: the tail stays hung out the whole way round ---- */
    var load=clamp(G.v/58,0.5,1);
    // The slide breathes: the tail swings out, the driver gathers it, it goes again.
    // A fixed angle is what kept the steering pinned to one side.
    // The driver is never still: dig the nose in, catch the tail, dig in again.
    // Three overlapping rates (~3.3 s, ~1.9 s, ~1.1 s) keep it working constantly.
    var swing=Math.sin(G.wob*1.90+G.ns)*0.30
             +Math.sin(G.wob*3.37+G.ns*1.7)*0.17
             +Math.sin(G.wob*5.81+G.ns*0.6)*0.09;
    var slipT=-(0.11+0.19*load)+swing-G.latVel*0.05-G.moment*0.32;
    G.yaw=lerp(G.yaw,clamp(slipT,-0.95,0.32),1-Math.pow(0.02,dt));

    if(G.staked&&G.autoOn&&G.mult>=G.auto)cashOut(true);   // banking does not end the run
    if(G.mult>=G.crashAt){crash();return;}
  }
  else if(G.phase==='crashing'){
    G.overT+=dt;G.wob+=dt;
    G.v=Math.max(0,G.v-6*dt);G.s=wrapS(G.s+G.v*dt*0.7);
    G.spin*=Math.pow(0.6,dt);G.yaw+=G.spin*dt*2.4;
    G.latVel-=15*dt;G.lat+=G.latVel*dt;
    if(G.lat<-(HALF_W+SHOULDER)){                // past the shoulder there is nothing
      G.vy-=26*dt;G.y+=G.vy*dt;
      G.roll-=dt*2.6;G.pitch+=dt*1.5;
    }
    G.shake=Math.max(0,G.shake-dt*0.8);
    if(G.y<-30||G.overT>2.6)enterSettle();
  }
  // ---- place car ----
  var r=sampleAt(G.s),rx=rgtX(r.h),rz=rgtZ(r.h);
  car.position.set(r.x+rx*G.lat,G.y,r.z+rz*G.lat);
  car.rotation.set(0,r.h+G.yaw,0);
  carBody.rotation.set(G.pitch,0,G.roll+clamp(-G.latVel*0.016+G.yaw*0.10,-0.18,0.18));
  carLamp.position.set(car.position.x,G.y+2.4,car.position.z);

  // physical roll: omega = v / r. Past ~0.5 rad per frame a six-spoke wheel
  // aliases and appears to spin backwards, so ease the visual rate beyond that.
  var step=(G.v/Math.max(wheelRadius,0.05))*dt;
  if(step>0.42)step=0.42+(step-0.42)*0.04;   // six spokes repeat every 1.05 rad
  for(var w=0;w<4;w++){
    wheels[w].rotation.x-=step;
    if(w<2)wheels[w].rotation.y=clamp(-G.yaw*0.92,-0.62,0.62);
  }
  // Real steering, not decoration. A driver points the front wheels down the path
  // the car is actually travelling. Work that out and both behaviours fall out of
  // it for free: turn-in when the car is straight, opposite lock when it is sideways.
  //   vAngle  - direction of travel relative to the track (+ = toward the outside)
  //   G.yaw   - where the body is pointing relative to the track
  //   their difference is the slip angle; the wheels cancel it.
  var WHEELBASE=2.8;
  var wantSteer;
  if(G.phase==='crashing'){
    wantSteer=(G.reason==='OVER THE EDGE'?1:-1)*0.48;          // hands full of lock
  }else{
    var vAngle=-Math.atan2(G.latVel,Math.max(G.v,1));
    var ackermann=-CURV*WHEELBASE;                             // geometry of the corner itself
    var tremor=Math.sin(G.wob*8.1+G.ns)*0.022+Math.sin(G.wob*13.7+G.ns*2.1)*0.013;
    wantSteer=clamp(vAngle-G.yaw+ackermann+tremor,-0.58,0.58);
  }
  G.steerAngle=lerp(G.steerAngle,wantSteer,1-Math.pow(0.0015,dt));  // quick hands
  for(var cw=0;cw<carWheels.length;cw++){
    var W=carWheels[cw];
    W.rotation.x-=step;
    if(W.name.charAt(6)==='F')W.rotation.y=G.steerAngle;   // WHEEL_F* are the front pair
  }


  // ---- smoke ----
  if(!reduceMotion&&(G.phase==='live'||G.phase==='crashing')){
    var slip=Math.abs(G.yaw);
    var heat=(slip>0.05?1:0)+(slip>0.3?1:0)+(G.moment>0.4?1:0)+(G.phase==='crashing'?2:0);
    if(heat>0){
      var cy=Math.cos(car.rotation.y), sy=Math.sin(car.rotation.y);
      var tint=Math.abs(G.lat)>HALF_W?0x7a6552:0xd6d9ff;
      var bursts=Math.min(4,1+heat);
      var rears=[];
      for(var rw=0;rw<carWheels.length;rw++)
        if(carWheels[rw].name.charAt(6)==='R')rears.push(carWheels[rw]);
      for(var q=0;q<bursts;q++){
        if(rears.length){                         // straight off the rear hubs
          var W=rears[q%rears.length];
          W.getWorldPosition(smokeAt);
          puff(smokeAt.x+(Math.random()-0.5)*0.5,
               smokeAt.y-0.18+Math.random()*0.2,
               smokeAt.z+(Math.random()-0.5)*0.5, tint);
        }else{
          var ox=(q%2?1.16:-1.16)+(Math.random()-0.5)*0.5;
          var oz=-1.72-Math.random()*1.5;
          puff(car.position.x+sy*oz+cy*ox, G.y+0.3+Math.random()*0.25,
               car.position.z+cy*oz-sy*ox, tint);
        }
      }
    }
  }
  for(var i=0;i<SMOKE_N;i++){
    var p=smoke[i];if(!p.sp.visible)continue;
    p.life+=dt;
    if(p.life>=p.max){p.sp.visible=false;continue;}
    var k=p.life/p.max;
    p.sp.position.x+=p.vx*dt;p.sp.position.y+=p.vy*dt;p.sp.position.z+=p.vz*dt;
    p.vy*=0.97;p.vx*=0.96;p.vz*=0.96;
    var sc=p.size*(1+k*3.5);p.sp.scale.set(sc,sc,1);
    p.sp.material.opacity=0.56*(1-k)*(1-k);
  }

  // ---- torn-out guardrail panels ----
  var dirty=false;
  for(var ri=0;ri<railData.length;ri++){
    var rr=railData[ri];
    if(!rr.hit||rr.y<-70)continue;
    rr.vy-=24*dt;rr.x+=rr.vx*dt;rr.z+=rr.vz*dt;rr.y+=rr.vy*dt;rr.rot+=rr.spin*dt;
    D2.position.set(rr.x,rr.y,rr.z);
    D2.rotation.set(rr.rot*0.7,rr.h+rr.rot,rr.rot);
    D2.scale.set(1,1,1);D2.updateMatrix();
    railMesh.setMatrixAt(ri,D2.matrix);dirty=true;
  }
  if(dirty)railMesh.instanceMatrix.needsUpdate=true;

  sky.position.set(car.position.x,0,car.position.z);
  if(sea)sea.position.set(Math.round(car.position.x/70)*70,-26,Math.round(car.position.z/70)*70);
  mountains.position.set(car.position.x,0,car.position.z);
}

/* ---- camera ---- */
var camT=new THREE.Vector3(), camAim=new THREE.Vector3();
function updateCamera(dt){
  if(G.phase==='betting'){
    G.orbit+=dt*0.15;
    // a high, slow drone circle: the car AND the corner it is sitting on
    var a=G.orbit, r0=sampleAt(G.s);
    camera.position.set(r0.x+Math.sin(a)*27.0, 12.5+Math.sin(a*2)*1.0, r0.z+Math.cos(a)*27.0);
    camAim.set(car.position.x,1.0,car.position.z);
    camera.lookAt(camAim);
    return;
  }
  var behind=5.5+G.v*0.022, height=2.55+G.v*0.0075, ahead=11+G.v*0.22;
  var rb=sampleAt(G.s-behind*0.5);
  var latCam=clamp(G.lat*0.55,-6,6);
  camT.set(
    car.position.x-fwdX(rb.h)*behind+rgtX(rb.h)*latCam*0.5,
    Math.max(G.y+height,G.y+2.2),
    car.position.z-fwdZ(rb.h)*behind+rgtZ(rb.h)*latCam*0.5
  );
  camera.position.lerp(camT,1-Math.pow(0.0022,dt));
  var ra=sampleAt(G.s+ahead);
  camAim.set(
    lerp(ra.x+rgtX(ra.h)*ra.target,car.position.x,0.45),
    G.y+1.5,
    lerp(ra.z+rgtZ(ra.h)*ra.target,car.position.z,0.45)
  );
  camera.lookAt(camAim);
  if(G.shake>0.01&&!reduceMotion){
    var amp=G.shake*0.5;
    camera.position.x+=(Math.random()-0.5)*amp;
    camera.position.y+=(Math.random()-0.5)*amp;
    camera.rotation.z+=(Math.random()-0.5)*amp*0.03;
  }
}

/* ---- HUD ---- */
var lastHud=0;
function updateHud(){
  if(G.phase==='live'||G.phase==='crashing'||G.phase==='over'){
    elMulti.textContent=G.mult.toFixed(2)+'x';
  }
  if(G.phase==='live'){
    elMulti.className='multi'+(G.grip<30?' danger':(G.grip>75?' locked':''));
    elCashVal.textContent=num(G.bet*G.mult);
  }
  var gp=Math.round(G.grip);
  paintSegs(elGripSegs,G.grip/100,gp<25?'low':(gp<60?'mid':''));
  elGripVal.textContent=gp+'%';
  paintSegs(elDriftSegs,Math.min(1,G.score/2500),'v');
  elDriftVal.textContent=num(G.score);
  elSpeed.textContent=Math.round(Math.min(G.v,60)*3.6);
}

var prev=performance.now();
function frame(now){
  var raw=(now-prev)/1000;prev=now;
  var dt=raw>1.0?1/60:Math.min(0.1,raw);     // only a real tab freeze clamps; slow frames still advance
  step(dt);updateCamera(dt);
  if(now-lastHud>60){updateHud();lastHud=now;}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function resize(){
  var w=stageEl.clientWidth,h=stageEl.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stageEl);
window.addEventListener('resize',resize);

function start(){
  setBet(G.bet);setAuto(G.auto);
  elAutoRow.classList.toggle('off',!G.autoOn);
  renderWallet();renderHistory();openBetting();resize();
  var r0=sampleAt(G.s);
  car.position.set(r0.x,0,r0.z);car.rotation.y=r0.h;
  camera.position.set(r0.x+10,4,r0.z+10);
  camera.lookAt(car.position.x,1,car.position.z);
  requestAnimationFrame(frame);
}
start();

if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){return {balance:G.balance,round:G.round};});
}
})();
</script>
